<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YouTube Transcribe Queue</title>
  <style>
    body { font-family: -apple-system, Segoe UI, sans-serif; background: #111; color: #eee; margin: 0; }
    #root { padding: 16px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    .counts span { margin-right: 14px; padding: 2px 8px; border-radius: 4px; background: #222; }
    .counts .ok { color: #8f8; }
    .counts .bad { color: #f88; }
    .current { margin-bottom: 10px; font-weight: bold; }
    button.active { background: #1e3a8a; outline: 2px solid #60a5fa; }
    button.small { padding: 3px 10px; font-size: 12px; background: #7f1d1d; }
    button.danger { background: #7f1d1d; }
    button.danger:disabled { background: #444; }
    #queue-list { background: #1a1a1a; border-radius: 6px; max-height: 65vh; overflow-y: auto; }
    #queue-list table { width: 100%; border-collapse: collapse; font-size: 13px; }
    #queue-list th { position: sticky; top: 0; background: #222; text-align: left; padding: 6px 10px; }
    #queue-list td { padding: 5px 10px; border-bottom: 1px solid #262626; vertical-align: middle; }
    #queue-list .ckcol { width: 28px; text-align: center; padding-left: 12px; }
    #queue-list tr.row-failed { background: #2a1414; }
    .vtitle { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vreason { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #f88; font-size: 12px; }
    .vtitle-link { color: #93c5fd; cursor: pointer; text-decoration: underline; }
    .vtitle-link:hover { color: #bfdbfe; }
    .link-btn { color: #f87171; font-size: 12px; text-decoration: none; border: 1px solid #7f1d1d; padding: 2px 8px; border-radius: 4px; }
    .link-btn:hover { background: #7f1d1d; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
    .badge-pending { background: #333; color: #ccc; }
    .badge-downloading { background: #1e40af; color: #dbeafe; }
    .badge-transcribing { background: #92400e; color: #fef3c7; }
    .badge-done { background: #14532d; color: #bbf7d0; }
    .badge-failed { background: #7f1d1d; color: #fecaca; }
    #log { background: #000; color: #0f0; font-family: monospace; font-size: 12px; height: 65vh; overflow-y: auto; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="../../node_modules/react/umd/react.production.min.js"></script>
  <script src="../../node_modules/react-dom/umd/react-dom.production.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
